<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXI E-Sports</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #0b061a;
            color: #00ffd1;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 255, 209, 0.6);
            margin-bottom: 20px;
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(176, 38, 255, 0.2);
            border-top: 4px solid #b026ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="logo">OXI E-SPORTS</div>
    <div class="loader"></div>

    <script src="config.js"></script>
    <script>
        // Automatic Auth Redirection
        auth.onAuthStateChanged(user => {
            setTimeout(() => {
                if (user) {
                    window.location.href = "home.html";
                } else {
                    window.location.href = "login.html";
                }
            }, 1000);
        });
    </script>
</body>
</html>
