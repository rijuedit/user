<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXI E-Sports - Tournaments</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0c0d18;
            color: #f1f5f9;
        }
        .heading-font {
            font-family: 'Rajdhani', sans-serif;
        }
        .app-card {
            background-color: #15172a;
            border: 1px solid #222543;
            border-radius: 14px;
        }
        .btn-gradient-purple {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
        }
        .btn-gradient-green {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        .bottom-nav-active {
            color: #a78bfa;
        }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Top Header Navigation -->
    <header class="bg-[#121424] border-b border-[#1e223d] sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-xl font-bold heading-font text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500">
                    OXI E-SPORTS
                </span>
            </div>
            
            <div class="flex items-center gap-3">
                <div onclick="switchUserTab('deposit')" class="cursor-pointer flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#1c1f3b] border border-purple-500/30 text-emerald-400 font-bold text-xs">
                    <i class="fa-solid fa-wallet"></i> ৳<span id="userWalletDisplay">0</span>
                </div>
                <button onclick="handleLogout()" class="text-slate-400 hover:text-rose-400 text-sm">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-4 space-y-5">

        <!-- Banner Carousel -->
        <div id="bannerCarousel" class="relative overflow-hidden rounded-2xl border border-[#222543] bg-[#15172a] h-40">
            <div id="bannerInner" class="flex transition-transform duration-500 h-full">
                <div class="w-full flex-shrink-0 h-full flex items-center justify-center text-slate-500 text-xs">
                    Loading banners...
                </div>
            </div>
        </div>

        <!-- MAIN VIEW 1: CATEGORY SELECTION VIEW -->
        <section id="userCategoriesSection">
            <h2 class="text-base font-bold heading-font text-white mb-3 flex items-center gap-2">
                <i class="fa-solid fa-gamepad text-purple-400"></i> Select Match Category
            </h2>
            <div id="userCategoriesGrid" class="grid grid-cols-2 gap-3">
                <!-- Populated via Firebase -->
            </div>
        </section>

        <!-- MAIN VIEW 2: CATEGORY MATCHES VIEW -->
        <section id="userMatchesSection" class="hidden">
            <div class="flex items-center justify-between mb-4">
                <button onclick="showUserCategories()" class="text-xs font-bold text-purple-400 flex items-center gap-1 bg-[#181a2e] px-3 py-1.5 rounded-lg border border-[#232747]">
                    <i class="fa-solid fa-arrow-left"></i> Back
                </button>
                <h3 id="selectedCategoryTitle" class="text-base font-bold text-white heading-font">Matches</h3>
            </div>

            <div id="userCategoryMatchesList" class="space-y-3">
                <!-- Dynamically populated matches -->
            </div>
        </section>

        <!-- MAIN VIEW 3: MY MATCHES -->
        <section id="userMyMatchesSection" class="hidden">
            <h2 class="text-base font-bold heading-font text-white mb-3 flex items-center gap-2">
                <i class="fa-solid fa-trophy text-amber-400"></i> My Joined Matches
            </h2>
            <div id="myJoinedMatchesContainer" class="space-y-3">
                <!-- Dynamically Populated Joined Matches -->
            </div>
        </section>

        <!-- MAIN VIEW 4: DEPOSIT / ADD MONEY -->
        <section id="userDepositSection" class="hidden">
            <h2 class="text-base font-bold heading-font text-white mb-3 flex items-center gap-2">
                <i class="fa-solid fa-wallet text-emerald-400"></i> Deposit Money
            </h2>

            <div id="paymentOptionsContainer" class="space-y-3 mb-5">
                <!-- Payment Numbers dynamically inserted -->
            </div>

            <div class="app-card p-4 space-y-3">
                <h3 class="text-xs font-bold uppercase text-slate-300">Submit Transaction</h3>
                <input id="depTrxId" type="text" placeholder="Enter TrxID" class="w-full bg-[#0c0d18] border border-[#222543] rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
                <input id="depAmount" type="number" placeholder="Enter Amount (৳)" class="w-full bg-[#0c0d18] border border-[#222543] rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
                <button onclick="submitDeposit()" class="w-full btn-gradient-purple text-white text-xs font-bold py-2.5 rounded-xl shadow">
                    Submit Deposit Request
                </button>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#121424] border-t border-[#1e223d] py-2 z-50">
        <div class="max-w-md mx-auto grid grid-cols-3 text-center text-xs text-slate-400">
            <button id="navBtnMatches" onclick="showUserCategories()" class="flex flex-col items-center gap-1 bottom-nav-active">
                <i class="fa-solid fa-gamepad text-base"></i>
                <span class="text-[10px] font-semibold">Matches</span>
            </button>
            <button id="navBtnMyMatches" onclick="switchUserTab('myMatches')" class="flex flex-col items-center gap-1">
                <i class="fa-solid fa-trophy text-base"></i>
                <span class="text-[10px] font-semibold">My Matches</span>
            </button>
            <button id="navBtnDeposit" onclick="switchUserTab('deposit')" class="flex flex-col items-center gap-1">
                <i class="fa-solid fa-wallet text-base"></i>
                <span class="text-[10px] font-semibold">Deposit</span>
            </button>
        </div>
    </nav>

    <!-- Script Section -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAkZkqcyP3P6QnbHT-wfxeygxgY9IoKBAU",
            authDomain: "oxi-esports.firebaseapp.com",
            databaseURL: "https://oxi-esports-default-rtdb.firebaseio.com",
            projectId: "oxi-esports",
            storageBucket: "oxi-esports.firebasestorage.app",
            messagingSenderId: "924353594492",
            appId: "1:924353594492:web:08329a3d1f67e7a5da35f9"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;
        let currentUserCleanEmail = '';

        function emailToKey(email) {
            return email ? email.replace(/\./g, ',') : '';
        }

        const SwalDark = Swal.mixin({
            customClass: {
                popup: 'bg-[#15172a] text-white border border-[#222543] rounded-2xl',
                title: 'text-white font-bold',
                confirmButton: 'btn-gradient-purple text-white font-bold px-4 py-2 rounded-xl text-sm mx-1',
                cancelButton: 'bg-slate-700 text-white font-bold px-4 py-2 rounded-xl text-sm mx-1'
            },
            buttonsStyling: false
        });

        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            currentUserCleanEmail = emailToKey(user.email);
            initUserApp();
        });

        function handleLogout() {
            auth.signOut().then(() => {
                window.location.href = 'index.html';
            });
        }

        function initUserApp() {
            // Balance Sync
            db.ref(`users/${currentUserCleanEmail}`).on('value', snapshot => {
                const u = snapshot.val() || {};
                document.getElementById('userWalletDisplay').innerText = u.wallet || 0;
            });

            // Load Banners
            db.ref('banners').on('value', snapshot => {
                const banners = snapshot.val() || {};
                const bannerInner = document.getElementById('bannerInner');
                bannerInner.innerHTML = '';
                
                const urls = Object.values(banners).map(b => b.image);
                if (urls.length === 0) {
                    bannerInner.innerHTML = `<div class="w-full flex-shrink-0 h-full flex items-center justify-center text-slate-500 text-xs">No banners available</div>`;
                    return;
                }

                urls.forEach(url => {
                    const img = document.createElement('img');
                    img.src = url;
                    img.className = 'w-full flex-shrink-0 h-full object-cover';
                    bannerInner.appendChild(img);
                });
            });

            // Load Categories
            loadUserCategories();
            loadPaymentSettings();
        }

        function showUserCategories() {
            document.getElementById('userCategoriesSection').classList.remove('hidden');
            document.getElementById('userMatchesSection').classList.add('hidden');
            document.getElementById('userMyMatchesSection').classList.add('hidden');
            document.getElementById('userDepositSection').classList.add('hidden');

            updateBottomNav('navBtnMatches');
        }

        function switchUserTab(tab) {
            document.getElementById('userCategoriesSection').classList.add('hidden');
            document.getElementById('userMatchesSection').classList.add('hidden');
            document.getElementById('userMyMatchesSection').classList.add('hidden');
            document.getElementById('userDepositSection').classList.add('hidden');

            if (tab === 'myMatches') {
                document.getElementById('userMyMatchesSection').classList.remove('hidden');
                updateBottomNav('navBtnMyMatches');
                loadMyJoinedMatches();
            } else if (tab === 'deposit') {
                document.getElementById('userDepositSection').classList.remove('hidden');
                updateBottomNav('navBtnDeposit');
            }
        }

        function updateBottomNav(activeId) {
            ['navBtnMatches', 'navBtnMyMatches', 'navBtnDeposit'].forEach(id => {
                const btn = document.getElementById(id);
                if (id === activeId) {
                    btn.classList.add('bottom-nav-active');
                } else {
                    btn.classList.remove('bottom-nav-active');
                }
            });
        }

        async function loadUserCategories() {
            const catSnap = await db.ref('match_categories').once('value');
            const categories = catSnap.val() || {};

            const grid = document.getElementById('userCategoriesGrid');
            grid.innerHTML = '';

            Object.entries(categories).forEach(([catKey, cat]) => {
                const card = document.createElement('div');
                card.onclick = () => showMatchesForCategory(catKey, cat.title);
                card.className = 'app-card p-4 text-center cursor-pointer hover:border-purple-500/50 transition';
                card.innerHTML = `
                    <div class="text-3xl text-purple-400 mb-2"><i class="fa-solid fa-gamepad"></i></div>
                    <div class="font-bold text-sm text-white">${cat.title}</div>
                    <div class="text-[10px] text-slate-400 mt-1">Tap to view matches</div>
                `;
                grid.appendChild(card);
            });
        }

        async function showMatchesForCategory(catKey, catTitle) {
            document.getElementById('selectedCategoryTitle').innerText = catTitle;
            document.getElementById('userCategoriesSection').classList.add('hidden');
            document.getElementById('userMatchesSection').classList.remove('hidden');

            const matchSnap = await db.ref('matches').once('value');
            const matches = matchSnap.val() || {};

            const container = document.getElementById('userCategoryMatchesList');
            container.innerHTML = '';

            const categoryMatches = Object.entries(matches).filter(([mId, m]) => m.categoryKey === catKey);

            if (categoryMatches.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 italic text-center py-6">No matches active under this category.</p>`;
                return;
            }

            categoryMatches.forEach(([mKey, m]) => {
                const joinedUsers = m.joinedUsers || {};
                const joinedCount = Object.keys(joinedUsers).length;
                const isJoined = !!joinedUsers[currentUserCleanEmail];

                const card = document.createElement('div');
                card.className = 'app-card p-4 space-y-3';
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-sm text-white">${m.title}</span>
                        <span class="text-xs font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">৳${m.entryFee} ENTRY</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-[11px] text-slate-300 bg-[#0c0d18] p-2.5 rounded-lg border border-[#222543]">
                        <div>Time: <span class="text-white">${m.matchTime}</span></div>
                        <div>Map: <span class="text-white">${m.map}</span></div>
                        <div>Prize: <span class="text-amber-300 font-bold">৳${m.prizePool}</span></div>
                        <div>Type: <span class="text-purple-300">${m.type}</span></div>
                    </div>
                    <div class="flex items-center justify-between text-xs pt-1">
                        <span class="text-slate-400">${joinedCount} / ${m.totalSpots || 48} Joined</span>
                        ${isJoined ? 
                            `<button onclick="viewRoomDetails('${mKey}')" class="btn-gradient-green text-white text-xs px-4 py-1.5 rounded-lg font-bold">Room Details</button>` : 
                            `<button onclick="joinMatch('${mKey}', ${m.entryFee})" class="btn-gradient-purple text-white text-xs px-4 py-1.5 rounded-lg font-bold">Join Match</button>`
                        }
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function joinMatch(mKey, entryFee) {
            const uSnap = await db.ref(`users/${currentUserCleanEmail}`).once('value');
            const user = uSnap.val() || {};

            if ((user.wallet || 0) < entryFee) {
                SwalDark.fire('Insufficient Balance', 'Please deposit coins to join this tournament.', 'error');
                return;
            }

            const { value: formValues } = await SwalDark.fire({
                title: 'Enter Free Fire Credentials',
                html: `
                    <input id="swal-ff-name" class="swal2-input bg-[#0c0d18] text-white border-[#222543]" placeholder="Free Fire Game Name">
                    <input id="swal-ff-uid" class="swal2-input bg-[#0c0d18] text-white border-[#222543]" placeholder="Free Fire UID">
                `,
                showCancelButton: true,
                preConfirm: () => {
                    return {
                        gameName: document.getElementById('swal-ff-name').value,
                        gameUid: document.getElementById('swal-ff-uid').value
                    };
                }
            });

            if (formValues && formValues.gameName && formValues.gameUid) {
                // Deduct Balance & Record
                await db.ref(`users/${currentUserCleanEmail}/wallet`).transaction(c => (c || 0) - entryFee);
                await db.ref(`matches/${mKey}/joinedUsers/${currentUserCleanEmail}`).set({
                    gameName: formValues.gameName,
                    gameUid: formValues.gameUid,
                    joinedAt: Date.now()
                });

                SwalDark.fire('Joined!', 'Successfully registered for match.', 'success');
                showUserCategories();
            }
        }

        async function viewRoomDetails(mKey) {
            const mSnap = await db.ref(`matches/${mKey}`).once('value');
            const m = mSnap.val() || {};

            SwalDark.fire({
                title: 'Room Credentials',
                html: `
                    <div class="text-left space-y-2 text-sm">
                        <div>Room ID: <span class="font-mono text-amber-300 font-bold">${m.roomId || 'Not published yet'}</span></div>
                        <div>Password: <span class="font-mono text-amber-300 font-bold">${m.roomPassword || 'Not published yet'}</span></div>
                    </div>
                `
            });
        }

        async function loadMyJoinedMatches() {
            const matchSnap = await db.ref('matches').once('value');
            const matches = matchSnap.val() || {};

            const container = document.getElementById('myJoinedMatchesContainer');
            container.innerHTML = '';

            let joinedAny = false;

            Object.entries(matches).forEach(([mKey, m]) => {
                if (m.joinedUsers && m.joinedUsers[currentUserCleanEmail]) {
                    joinedAny = true;
                    const card = document.createElement('div');
                    card.className = 'app-card p-4 space-y-2';
                    card.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-sm text-white">${m.title}</span>
                            <span class="text-xs text-purple-400">${m.matchTime}</span>
                        </div>
                        <button onclick="viewRoomDetails('${mKey}')" class="w-full btn-gradient-green text-white text-xs py-2 rounded-lg font-bold mt-2">
                            View Room ID & Password
                        </button>
                    `;
                    container.appendChild(card);
                }
            });

            if (!joinedAny) {
                container.innerHTML = `<p class="text-xs text-slate-500 italic text-center py-6">You have not joined any matches yet.</p>`;
            }
        }

        async function loadPaymentSettings() {
            const psSnap = await db.ref('paymentSettings').once('value');
            const ps = psSnap.val() || {};

            const container = document.getElementById('paymentOptionsContainer');
            container.innerHTML = '';

            const gateways = [
                { name: 'bKash', num: ps.bkash, active: ps.bkashActive, color: 'text-pink-500' },
                { name: 'Nagad', num: ps.nagad, active: ps.nagadActive, color: 'text-orange-400' },
                { name: 'Rocket', num: ps.rocket, active: ps.rocketActive, color: 'text-purple-400' }
            ];

            gateways.forEach(g => {
                if (g.active && g.num) {
                    const card = document.createElement('div');
                    card.className = 'app-card p-3 flex items-center justify-between';
                    card.innerHTML = `
                        <div>
                            <span class="text-xs font-bold ${g.color}">${g.name} Personal</span>
                            <div class="text-sm font-mono text-white mt-0.5">${g.num}</div>
                        </div>
                        <button onclick="navigator.clipboard.writeText('${g.num}'); SwalDark.fire('Copied', 'Number copied to clipboard', 'success');" class="bg-[#1c1f3b] text-slate-300 hover:text-white px-3 py-1.5 rounded-lg text-xs font-medium border border-[#2e335e]">
                            Copy
                        </button>
                    `;
                    container.appendChild(card);
                }
            });
        }

        async function submitDeposit() {
            const trxId = document.getElementById('depTrxId').value.trim();
            const amount = Number(document.getElementById('depAmount').value);

            if (!trxId || !amount) {
                SwalDark.fire('Error', 'Please enter TrxID and Amount.', 'error');
                return;
            }

            const reqRef = db.ref('deposit_requests').push();
            await reqRef.set({
                userKey: currentUserCleanEmail,
                userEmail: currentUser.email,
                trxId: trxId,
                amount: amount,
                status: 'pending',
                timestamp: Date.now()
            });

            document.getElementById('depTrxId').value = '';
            document.getElementById('depAmount').value = '';

            SwalDark.fire('Submitted!', 'Deposit request submitted for verification.', 'success');
        }
    </script>
</body>
</html>
