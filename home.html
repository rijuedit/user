<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXI E-Sports - Home</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background: #0b061a; color: #fff; font-family: sans-serif; margin: 0; padding-bottom: 70px; }
        
        /* Header */
        .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; background: #160d2e; border-bottom: 1px solid rgba(0,255,209,0.1); }
        .wallet-badge { background: rgba(0,255,209,0.1); color: #00ffd1; padding: 5px 12px; border-radius: 20px; border: 1px solid #00ffd1; font-weight: bold; cursor: pointer; }

        /* Banner Slider */
        .slider-container { width: 100%; overflow: hidden; margin-top: 10px; }
        .slider { display: flex; transition: transform 0.5s ease-in-out; }
        .slider img { width: 100%; aspect-ratio: 16 / 7; object-fit: cover; flex-shrink: 0; }

        /* Category Grid (1:1 Ratio) */
        .grid-title { padding: 20px 20px 10px; font-size: 18px; font-weight: bold; color: #00ffd1; }
        .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .cat-card { background: #160d2e; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .cat-card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; }
        .cat-card p { padding: 10px; text-align: center; margin: 0; font-weight: 600; font-size: 14px; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #160d2e; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(0,255,209,0.1); }
        .nav-item { color: #888; text-decoration: none; text-align: center; font-size: 12px; }
        .nav-item.active { color: #00ffd1; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="color:#00ffd1; margin:0;">OXI E-SPORTS</h2>
        <div class="wallet-badge" onclick="location.href='wallet.html'">
            <i class="fas fa-wallet"></i> ৳<span id="u-balance">0</span>
        </div>
    </div>

    <!-- Banners -->
    <div class="slider-container">
        <div class="slider" id="main-slider"></div>
    </div>

    <div class="grid-title">SELECT TO PLAY</div>
    <div class="cat-grid" id="category-list"></div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="home.html" class="nav-item active"><i class="fas fa-home"></i>Home</a>
        <a href="wallet.html" class="nav-item"><i class="fas fa-wallet"></i>Wallet</a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i>Profile</a>
    </div>

    <script src="config.js"></script>
    <script>
        checkUserAuth();

        // Load Balance
        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + emailToKey(user.email)).on('value', s => {
                    document.getElementById('u-balance').innerText = s.val().wallet || 0;
                });
            }
        });

        // Load Banners
        db.ref('banners').on('value', snapshot => {
            const slider = document.getElementById('main-slider');
            slider.innerHTML = "";
            snapshot.forEach(child => {
                const b = child.val();
                slider.innerHTML += `<img src="${b.image}" onclick="if('${b.link}') window.open('${b.link}')">`;
            });
            startAutoSlider();
        });

        // Load Categories
        db.ref('match_categories').on('value', snapshot => {
            const list = document.getElementById('category-list');
            list.innerHTML = "";
            snapshot.forEach(child => {
                const cat = child.val();
                list.innerHTML += `
                    <div class="cat-card" onclick="location.href='matches.html?cat=${child.key}'">
                        <img src="${cat.image}">
                        <p>${cat.title}</p>
                    </div>`;
            });
        });

        function startAutoSlider() {
            let index = 0;
            const slider = document.getElementById('main-slider');
            setInterval(() => {
                const images = slider.getElementsByTagName('img');
                if(images.length > 1) {
                    index = (index + 1) % images.length;
                    slider.style.transform = `translateX(-${index * 100}%)`;
                }
            }, 3000);
        }
    </script>
</body>
</html>
