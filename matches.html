<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Matches - OXI E-Sports</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #6c5ce7;
            --bg: #fbf9ff;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-sub: #636e72;
            --accent: #a29bfe;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text-main); padding-bottom: 80px; min-height: 100vh; }

        /* Header */
        .header {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            padding: 20px;
            color: white;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 10px rgba(108, 92, 231, 0.3);
        }
        .header h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: 0.5px; }

        /* Category Info Bar */
        .category-info {
            background: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #eee;
        }
        .category-info img { width: 50px; height: 50px; border-radius: 12px; object-fit: cover; }
        .category-info h2 { font-size: 1.1rem; color: var(--text-main); }

        /* Matches List */
        .matches-container { padding: 15px; }
        .match-card {
            background: var(--card-bg);
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.03);
            position: relative;
        }

        .match-header { position: relative; height: 160px; }
        .match-header img { width: 100%; height: 100%; object-fit: cover; }
        .match-status {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: white;
            z-index: 2;
        }
        .status-open { background: #00b894; }
        .status-closed { background: #d63031; }

        .match-body { padding: 15px; }
        .match-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 12px; color: #2d3436; }

        .match-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: #f8f9fe;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .stat-item { text-align: center; }
        .stat-label { font-size: 0.7rem; color: var(--text-sub); display: block; margin-bottom: 2px; }
        .stat-value { font-size: 0.85rem; font-weight: 600; color: var(--primary); }

        .match-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }
        .info-item { display: flex; align-items: center; gap: 8px; color: var(--text-sub); }
        .info-item i { color: var(--primary); width: 14px; }

        /* Slots Bar */
        .slots-container { margin-bottom: 15px; }
        .slots-header { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 6px; }
        .slots-bar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
        .slots-fill { height: 100%; background: var(--primary); border-radius: 4px; transition: width 0.3s ease; }

        .match-footer { display: flex; gap: 10px; }
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .btn-join { background: var(--primary); color: white; }
        .btn-join:disabled { background: #ccc; cursor: not-allowed; }

        /* Skeleton Loader */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 5px;
            box-shadow: 0 -2px 15px rgba(0,0,0,0.05);
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #b2bec3;
            font-size: 0.75rem;
            padding: 5px 15px;
            border-radius: 20px;
            transition: 0.3s;
        }
        .nav-item.active {
            color: var(--primary);
            background: rgba(108, 92, 231, 0.1);
        }
        .nav-item i { font-size: 1.2rem; margin-bottom: 4px; }

        /* Swal Custom Styling */
        .swal-field-label {
            text-align: left;
            display: block;
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #2d3436;
        }
        .swal2-input {
            margin: 5px 0 0 0 !important;
            width: 100% !important;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="pageTitle">Tournaments</h1>
    </div>

    <div class="category-info" id="categoryHeader" style="display: none;">
        <img id="catImg" src="" alt="">
        <h2 id="catName">Category</h2>
    </div>

    <div class="matches-container" id="matchesList">
        <!-- Skeletons -->
        <div class="match-card">
            <div class="match-header skeleton"></div>
            <div class="match-body">
                <div style="height:20px; width:60%; margin-bottom:15px;" class="skeleton"></div>
                <div style="height:60px; margin-bottom:15px;" class="skeleton"></div>
                <div style="height:40px;" class="skeleton"></div>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <i class="fas fa-gamepad"></i>
            <span>Play</span>
        </a>
        <a href="my-matches.html" class="nav-item">
            <i class="fas fa-trophy"></i>
            <span>My Matches</span>
        </a>
        <a href="results.html" class="nav-item">
            <i class="fas fa-poll"></i>
            <span>Results</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAkZkqcyP3P6QnbHT-wfxeygxgY9IoKBAU",
            authDomain: "oxi-esports.firebaseapp.com",
            projectId: "oxi-esports",
            storageBucket: "oxi-esports.firebasestorage.app",
            messagingSenderId: "924353594492",
            appId: "1:924353594492:web:08329a3d1f67e7a5da35f9",
            databaseURL: "https://oxi-esports-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const categoryKey = urlParams.get('cat');

        let currentUser = null;
        let userData = null;

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                const userKey = user.email.replace(/\./g, ',');
                db.ref(`users/${userKey}`).on('value', snap => {
                    userData = snap.val();
                });
                loadContent();
            } else {
                window.location.href = 'index.html';
            }
        });

        function loadContent() {
            if (categoryKey) {
                db.ref(`match_categories/${categoryKey}`).once('value', snap => {
                    const cat = snap.val();
                    if (cat) {
                        document.getElementById('categoryHeader').style.display = 'flex';
                        document.getElementById('catImg').src = cat.image;
                        document.getElementById('catName').innerText = cat.title;
                        document.getElementById('pageTitle').innerText = cat.title;
                    }
                });
            }
            loadMatches();
        }

        function loadMatches() {
            const matchesList = document.getElementById('matchesList');
            
            // Client-side filtering to avoid index issues on GitHub/Firebase
            db.ref('matches').once('value', (snapshot) => {
                matchesList.innerHTML = '';
                const data = snapshot.val();
                
                if (!data) {
                    matchesList.innerHTML = '<div style="text-align:center; padding:50px; color:#636e72;">No matches available.</div>';
                    return;
                }

                const matchArray = [];
                for (let key in data) {
                    const m = data[key];
                    // Filter by category if needed
                    if (!categoryKey || m.categoryKey === categoryKey) {
                        matchArray.push({ id: key, ...m });
                    }
                }

                if (matchArray.length === 0) {
                    matchesList.innerHTML = '<div style="text-align:center; padding:50px; color:#636e72;">No matches available for this category.</div>';
                    return;
                }

                // Sort by creation or time (latest first)
                matchArray.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                matchArray.forEach(match => {
                    const joinedCount = match.joinedUsers ? Object.keys(match.joinedUsers).length : 0;
                    const fillPercent = (joinedCount / match.totalSpots) * 100;
                    const isFull = joinedCount >= match.totalSpots;
                    const statusText = match.status || 'open';

                    const card = `
                        <div class="match-card">
                            <div class="match-header">
                                <span class="match-status ${statusText === 'open' ? 'status-open' : 'status-closed'}">
                                    ${statusText}
                                </span>
                                <img src="${match.categoryImage || 'https://via.placeholder.com/400x160?text=Free+Fire'}" alt="Match Banner">
                            </div>
                            <div class="match-body">
                                <h3 class="match-title">${match.title}</h3>
                                
                                <div class="match-stats">
                                    <div class="stat-item">
                                        <span class="stat-label">WIN PRIZE</span>
                                        <span class="stat-value">৳${match.winPrize}</span>
                                    </div>
                                    <div class="stat-item">
                                        <span class="stat-label">PER KILL</span>
                                        <span class="stat-value">৳${match.perKill}</span>
                                    </div>
                                    <div class="stat-item">
                                        <span class="stat-label">ENTRY FEE</span>
                                        <span class="stat-value">৳${match.entryFee}</span>
                                    </div>
                                </div>

                                <div class="match-info-grid">
                                    <div class="info-item"><i class="far fa-calendar-alt"></i> ${match.matchDate}</div>
                                    <div class="info-item"><i class="far fa-clock"></i> ${match.matchTime}</div>
                                    <div class="info-item"><i class="fas fa-users"></i> ${match.type}</div>
                                    <div class="info-item"><i class="fas fa-map-marked-alt"></i> ${match.map}</div>
                                </div>

                                <div class="slots-container">
                                    <div class="slots-header">
                                        <span>Spots Filled: ${joinedCount}/${match.totalSpots}</span>
                                        <span>${match.totalSpots - joinedCount} left</span>
                                    </div>
                                    <div class="slots-bar">
                                        <div class="slots-fill" style="width: ${fillPercent}%"></div>
                                    </div>
                                </div>

                                <div class="match-footer">
                                    <button class="btn btn-join" 
                                        onclick="openJoinModal('${match.id}', '${match.type}', ${match.entryFee})"
                                        ${(isFull || statusText !== 'open') ? 'disabled' : ''}>
                                        ${isFull ? 'MATCH FULL' : (statusText !== 'open' ? 'CLOSED' : 'JOIN NOW')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    matchesList.insertAdjacentHTML('beforeend', card);
                });
            }, (error) => {
                matchesList.innerHTML = '<div style="text-align:center; padding:50px; color:red;">Failed to load matches.</div>';
            });
        }

        async function openJoinModal(matchId, matchType, entryFee) {
            if (!userData) return;

            if (userData.wallet < entryFee) {
                Swal.fire({
                    icon: 'error',
                    title: 'Insufficient Balance',
                    text: 'Please add money to your wallet to join this match.',
                    confirmButtonText: 'Add Money',
                    confirmButtonColor: '#6c5ce7',
                    showCancelButton: true
                }).then((result) => {
                    if (result.isConfirmed) window.location.href = 'profile.html';
                });
                return;
            }

            // check if already joined
            const userKey = currentUser.email.replace(/\./g, ',');
            const joinSnap = await db.ref(`matches/${matchId}/joinedUsers/${userKey}`).once('value');
            if (joinSnap.exists()) {
                Swal.fire('Already Joined', 'You have already registered for this match.', 'info');
                return;
            }

            let slots = 1;
            if (matchType.toUpperCase().includes('DUO')) slots = 2;
            if (matchType.toUpperCase().includes('SQUAD')) slots = 4;

            let htmlInputs = `<p style="font-size: 0.9rem; color: #636e72; margin-bottom: 10px;">Entry Fee: <b style="color:#6c5ce7">BDT ${entryFee}</b> will be deducted from your wallet balance.</p>`;
            
            for (let i = 1; i <= slots; i++) {
                htmlInputs += `
                    <label class="swal-field-label">Player ${i} Game Nickname (Not UID)</label>
                    <input id="p${i}" class="swal2-input" placeholder="Enter Game Nickname here...">
                `;
            }

            Swal.fire({
                title: `Join Match (${matchType})`,
                html: htmlInputs,
                showCancelButton: true,
                confirmButtonText: 'Confirm & Join',
                confirmButtonColor: '#6c5ce7',
                cancelButtonColor: '#636e72',
                preConfirm: () => {
                    let players = [];
                    for (let i = 1; i <= slots; i++) {
                        let val = document.getElementById(`p${i}`).value.trim();
                        if (!val) {
                            Swal.showValidationMessage(`Please enter Nickname for Player ${i}`);
                            return false;
                        }
                        players.push(val);
                    }
                    return players;
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    processJoin(matchId, result.value, entryFee);
                }
            });
        }

        function processJoin(matchId, players, entryFee) {
            const userKey = currentUser.email.replace(/\./g, ',');
            const matchRef = db.ref(`matches/${matchId}`);
            
            Swal.showLoading();

            matchRef.transaction((currentData) => {
                if (currentData) {
                    const joinedCount = currentData.joinedUsers ? Object.keys(currentData.joinedUsers).length : 0;
                    if (joinedCount >= currentData.totalSpots) return; // Full

                    if (!currentData.joinedUsers) currentData.joinedUsers = {};
                    currentData.joinedUsers[userKey] = {
                        email: currentUser.email,
                        players: players,
                        joinedAt: firebase.database.ServerValue.TIMESTAMP
                    };
                    return currentData;
                }
                return currentData;
            }, (error, committed, snapshot) => {
                if (committed) {
                    // Deduct Wallet
                    db.ref(`users/${userKey}/wallet`).transaction(balance => (balance || 0) - entryFee);
                    
                    // Increment Match Count
                    db.ref(`users/${userKey}/matchesPlayed`).transaction(count => (count || 0) + 1);

                    Swal.fire({
                        icon: 'success',
                        title: 'Joined Successfully!',
                        text: 'Your registration is complete.',
                        confirmButtonColor: '#6c5ce7'
                    }).then(() => loadMatches());
                } else {
                    Swal.fire('Error', 'Match might be full or closed.', 'error');
                }
            });
        }
    </script>
</body>
</html>
