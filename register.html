<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - OXI E-Sports</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #0b061a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .reg-box { background: #160d2e; padding: 30px; border-radius: 20px; width: 90%; max-width: 380px; border: 1px solid rgba(0,255,209,0.2); }
        h2 { color: #00ffd1; text-align: center; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: rgba(0,0,0,0.3); border: 1px solid #333; color: #fff; border-radius: 10px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #00ffd1; }
        button { width: 100%; padding: 12px; background: #b026ff; border: none; color: #fff; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background: #8a2be2; box-shadow: 0 0 15px #b026ff; }
        .link { text-align: center; margin-top: 15px; font-size: 14px; color: #888; }
        .link a { color: #00ffd1; text-decoration: none; }
    </style>
</head>
<body>
    <div class="reg-box">
        <h2>OXI E-SPORTS</h2>
        <input type="text" id="name" placeholder="Full Name">
        <input type="number" id="phone" placeholder="Mobile Number">
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="pass" placeholder="Password (Min 6 chars)">
        <button onclick="register()">Create Account</button>
        <div class="link">Already have an account? <a href="login.html">Login</a></div>
    </div>

    <script src="config.js"></script>
    <script>
        function register() {
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('pass').value;

            if(!name || !phone || !email || pass.length < 6) {
                SwalLight.fire('Error', 'Please fill all fields correctly.', 'error');
                return;
            }

            auth.createUserWithEmailAndPassword(email, pass).then(res => {
                const uKey = emailToKey(email);
                db.ref('users/' + uKey).set({
                    name: name,
                    phone: phone,
                    email: email,
                    wallet: 0,
                    joined: Date.now()
                }).then(() => {
                    SwalLight.fire('Success', 'Account created! Loading home...', 'success');
                    setTimeout(() => window.location.href = "home.html", 1500);
                });
            }).catch(err => SwalLight.fire('Error', err.message, 'error'));
        }
    </script>
</body>
</html>
